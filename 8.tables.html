<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>

<body>
    <h1>Tables</h1>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Dinesh</td>
            <td>30</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Rishi</td>
            <td>28</td>
            <td>San Francisco</td>
        </tr>
        <tr>
            <td>Geethu</td>
            <td>25</td>
            <td>Los Angeles</td>
        </tr>
        <tr>
            <td>Koushik</td>
            <td>32</td>
            <td>Chicago</td>
        </tr>
    </table>
    <br>
    <h2>Spanning Columns and Rows</h2>
    <table border="1">
        <tr>
            <th>S.No</th>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Laptop</td>
            <td>$1000</td>
            <td>5</td>
        </tr>
        <tr>
            <td>2</td>
            <td rowspan="2">Phone</td>
            <td colspan="2">$500</td>
            
        </tr>
        <tr>
            <td>3</td>
            
            <td>$300</td>
            <td>7</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Headphones</td>
            <td colspan="2">$100</td>
            
        </tr>
        <tr>
            <td>5</td>
            <td>Smartwatch</td>
            <td>$200</td>
            <td>8</td>
        </tr>
    </table>

</body>

</html>
