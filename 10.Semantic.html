<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic HTML Example</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Welcome Section</h2>
            <p>This is a semantic HTML example.</p>
        </section>

        <article>
            <h2>Blog Post</h2>
            <p>This is an article content.</p>
        </article>

        <aside>
            <p>Related links or ads</p>
        </aside>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
