<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Italic and Underline</title>
</head>

<body>
    <p>Iam a good <b>Boy</b>.</p>
    <p>Iam a good <i>Boy</i>.</p>
    <p>Iam a good <u>Boy</u>.</p>
    <p>Iam a good <b><i><u>Boy</u></i></b>.</p>
    <p>Iam a good <s>Boy</s>.</p>
    or
    <p>Iam a good <del>Boy</del></p>
    or
    <p>Iam a good <mark>Boy</mark>.</p>
    or
    <p>H<sub>2</sub>O</p>
    <p>2<sup>5n</sup></p>
    <p>Iam a good <em>Boy</em>.</p>
</body>

</html>
