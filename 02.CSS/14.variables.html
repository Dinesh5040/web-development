<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<style>
    :root {
        --primary-color: rgb(205, 205, 244);
        --font-size: 20px;
        --margin-left: 50px;
        --margin-right: 50px;
        --border-radius: 18px;

    }

    .container {
        background-color: bisque;
        margin: 50px;
        border-radius: var(--border-radius);
    }

    .Box {
        font-size: var(--font-size);
        margin: 54px;
        background-color: aquamarine;
        color: blue;
        margin-top: 65px;
        border-radius: var(--border-radius);
        text-align: center;
    }

    body {
        background-color: var(--primary-color);
    }

    footer {
        font-size: var(--font-size);
        margin-left: var(--margin-left);
        margin-right: var(--margin-right);
        background-color: rgb(199, 230, 172);
        text-align: center;
        border-radius: 25px;
        height: 50px;
        align-content: center;

    }
</style>

<body>

    <div class="container">

        <div class="Box">Box1</div>
        <div class="Box">Box2</div>
        <div class="Box">Box3</div>
        <div class="Box">Box4</div>
        <div class="Box">Box5</div>
        <div class="Box">Box6</div>
    </div>
    <!-- Use --variable-name to declare and var(--variable-name) to use.
Declare in :root for global usage.
Support theming, dynamic styles, and cleaner code.
Can be scoped or overridden for flexibility. -->
    <footer>
        Copyright | All rights reserved.
    </footer>
</body>

</html>
